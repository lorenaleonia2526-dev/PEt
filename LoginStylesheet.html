<style>
  #login-overlay {
    --login-bg: #F9FAFE;
    --login-surface: #FFFFFF;
    --login-blue-light: #8BB2FC;
    --login-blue: #71A0F7;
    --login-blue-medium: #3E58B0;
    --login-indigo: #231E54;
    --login-violet: #8E70AE;
    --login-teal: #70B1AB;
    --login-muted: #73758A;
    --login-line: rgba(35, 30, 84, 0.12);
    --login-ease: cubic-bezier(0.22, 1, 0.36, 1);
    width: 100vw;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(430px, 0.88fr) minmax(520px, 1.12fr);
    position: fixed;
    inset: 0;
    z-index: 99999;
    overflow: auto;
    background: var(--login-bg);
    color: var(--login-indigo);
    font-family: "Ubuntu", sans-serif;
  }

  #login-overlay * {
    box-sizing: border-box;
  }

  .ag-login-panel {
    min-height: 100vh;
    padding: clamp(34px, 5vw, 76px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 42px;
    position: relative;
    z-index: 2;
    background:
      radial-gradient(circle at 8% 3%, rgba(139, 178, 252, 0.14), transparent 28%),
      var(--login-surface);
  }

  .ag-login-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    width: fit-content;
  }

  .ag-login-brand-mark {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--login-indigo);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    box-shadow: 0 10px 26px rgba(35, 30, 84, 0.20);
  }

  .ag-login-brand-copy strong {
    display: block;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .ag-login-brand-copy span {
    display: block;
    margin-top: 3px;
    color: var(--login-muted);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .ag-login-content {
    width: 100%;
    max-width: 450px;
    margin: auto;
    animation: agLoginRise 720ms 100ms var(--login-ease) both;
  }

  .ag-login-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--login-blue-medium);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.17em;
    text-transform: uppercase;
  }

  .ag-login-eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    background: currentColor;
  }

  .ag-login-title {
    margin: 22px 0 13px;
    color: var(--login-indigo);
    font-size: clamp(42px, 5vw, 66px);
    font-weight: 300;
    line-height: 0.98;
    letter-spacing: -0.055em;
  }

  .ag-login-description {
    max-width: 390px;
    color: var(--login-muted);
    font-size: 13px;
    line-height: 1.65;
  }

  #login-form {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .ag-login-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ag-login-field label {
    color: var(--login-indigo);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .ag-login-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .ag-login-input-icon {
    width: 19px;
    height: 19px;
    position: absolute;
    left: 17px;
    z-index: 1;
    color: var(--login-blue-medium);
    pointer-events: none;
  }

  .ag-login-input-icon svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #login-email,
  #login-password {
    width: 100%;
    height: 54px;
    padding: 0 48px;
    border: 1px solid var(--login-line);
    border-radius: 16px;
    outline: none;
    background: rgba(249, 250, 254, 0.80);
    color: var(--login-indigo);
    font-size: 14px;
    transition:
      border-color 220ms ease,
      background 220ms ease,
      box-shadow 220ms ease,
      transform 220ms var(--login-ease);
  }

  #login-email::placeholder,
  #login-password::placeholder {
    color: #A2A4B2;
  }

  #login-email:focus,
  #login-password:focus {
    border-color: rgba(62, 88, 176, 0.46);
    background: #FFFFFF;
    box-shadow: 0 0 0 4px rgba(113, 160, 247, 0.12);
    transform: translateY(-1px);
  }

  #toggle-password {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    position: absolute;
    right: 9px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--login-blue-medium);
    cursor: pointer;
    transition: background 200ms ease, color 200ms ease;
  }

  #toggle-password:hover {
    background: rgba(139, 178, 252, 0.15);
    color: var(--login-indigo);
  }

  #toggle-password svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .ag-login-options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }

  .ag-login-remember {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--login-muted);
    font-size: 11px;
    cursor: pointer;
  }

  #remember-login {
    width: 15px;
    height: 15px;
    accent-color: var(--login-indigo);
    cursor: pointer;
  }

  .ag-login-link {
    padding: 4px 0;
    border: 0;
    background: transparent;
    color: var(--login-blue-medium);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }

  .ag-login-link:hover {
    color: var(--login-indigo);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  #login-btn-submit {
    width: 100%;
    height: 54px;
    border: 0;
    border-radius: 999px;
    background: var(--login-indigo);
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.015em;
    cursor: pointer;
    box-shadow: 0 14px 30px rgba(35, 30, 84, 0.20);
    transition:
      transform 250ms var(--login-ease),
      box-shadow 250ms ease,
      background 250ms ease;
  }

  #login-btn-submit:hover:not(:disabled) {
    transform: translateY(-3px);
    background: var(--login-blue-medium);
    box-shadow: 0 18px 36px rgba(62, 88, 176, 0.24);
  }

  #login-btn-submit:disabled {
    cursor: wait;
  }

  #login-err {
    min-height: 18px;
    margin: 0;
    color: #C2415A;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.45;
    text-align: center;
  }

  .ag-login-security {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: var(--login-muted);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .ag-login-security::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--login-teal);
    box-shadow: 0 0 0 5px rgba(112, 177, 171, 0.12);
  }

  .ag-login-visual {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: #DDEAFE;
  }

  .ag-login-visual-image {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    object-fit: cover;
    object-position: center;
    animation: agLoginImage 1200ms var(--login-ease) both;
  }

  .ag-login-visual::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg, rgba(35, 30, 84, 0.04), transparent 42%, rgba(35, 30, 84, 0.30)),
      linear-gradient(90deg, rgba(35, 30, 84, 0.08), transparent 34%);
    pointer-events: none;
  }

  .ag-login-grid {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: 0.44;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.55) 1px, transparent 1px);
    background-size: 25% 25%;
    pointer-events: none;
  }

  .ag-login-visual-copy {
    position: absolute;
    inset: 0;
    z-index: 3;
    padding: clamp(38px, 5vw, 78px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #FFFFFF;
  }

  .ag-login-visual-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .ag-login-visual-label::before {
    content: "";
    width: 9px;
    height: 9px;
    background: #FFFFFF;
  }

  .ag-login-visual-bottom {
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.58);
  }

  .ag-login-visual-bottom h2 {
    max-width: 650px;
    margin: 0;
    font-size: clamp(48px, 6.8vw, 106px);
    font-weight: 300;
    line-height: 0.88;
    letter-spacing: -0.065em;
    text-shadow: 0 12px 44px rgba(35, 30, 84, 0.18);
  }

  .ag-login-visual-meta {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  @keyframes agLoginRise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes agLoginImage {
    from { opacity: 0; transform: scale(1.08); }
    to { opacity: 1; transform: scale(1.02); }
  }

  @media (max-width: 920px) {
    #login-overlay {
      grid-template-columns: 1fr;
    }

    .ag-login-panel {
      min-height: 100vh;
    }

    .ag-login-visual {
      display: none;
    }
  }

  @media (max-width: 560px) {
    .ag-login-panel {
      padding: 26px 20px;
      gap: 34px;
    }

    .ag-login-content {
      margin: 10px auto auto;
    }

    .ag-login-title {
      font-size: 45px;
    }

    .ag-login-options {
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #login-overlay *,
    #login-overlay *::before,
    #login-overlay *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
