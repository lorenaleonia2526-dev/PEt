            <span class="ag-card-top"><span class="ag-card-number">Módulo 05</span><span class="ag-card-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"></path><path d="m8 12 3 3 5-6"></path></svg></span></span>

      <div class="ag-module-toolbar">

        <button class="ag-back-button" type="button" onclick="showDashboard()"><span aria-hidden="true">←</span>Volver a módulos</button>

        <div class="ag-module-heading"><span>Módulo activo</span><strong id="ag-active-module-title">AG Operations</strong></div>

      </div>



      <main id="main-module-container" aria-live="polite">

        <div class="ag-loading"><div class="ag-loading-inner"><span class="ag-spinner" aria-hidden="true"></span><span>Preparando módulo...</span></div></div>

      </main>

    </section>

<script>
  /** @type {string} */
  let agCurrentModule = '';

  /** @type {number} */
  let agModuleRequest = 0;

  /**
   * Abre un módulo únicamente con una sesión acreditada.
   *
   * @param {string} moduleFileName
   * @param {string} moduleTitle
   * @returns {void}
   */
  function openModule(moduleFileName, moduleTitle) {
    if (!window.AGLogin || !window.AGLogin.isAuthorized()) {
      return;
    }

    const dashboard = document.getElementById('ag-dashboard-view');
    const moduleView = document.getElementById('ag-module-view');
    const title = document.getElementById('ag-active-module-title');

    agCurrentModule = moduleFileName;

    if (title) {
      title.textContent = moduleTitle || moduleFileName;
    }

    if (dashboard) {
      dashboard.hidden = true;
    }

    if (moduleView) {
      moduleView.hidden = false;
    }

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

    switchModule(moduleFileName, null);
  }

  /**
   * Regresa al dashboard e invalida las cargas pendientes.
   *
   * @returns {void}
   */
  function showDashboard() {
    agModuleRequest++;

    const dashboard = document.getElementById('ag-dashboard-view');
    const moduleView = document.getElementById('ag-module-view');

    if (moduleView) {
      moduleView.hidden = true;
    }

    if (dashboard) {
      dashboard.hidden = false;
    }

    agCurrentModule = '';

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }

  /**
   * Solicita HTML mediante el wrapper que envía el ID token.
   * Descarta respuestas de navegaciones o sesiones anteriores.
   *
   * @param {string} moduleFileName
   * @param {HTMLElement|null} btnElement
   * @returns {void}
   */
  function switchModule(moduleFileName, btnElement) {
    if (!window.AGLogin || !window.AGLogin.isAuthorized()) {
      return;
    }

    const request = ++agModuleRequest;

    if (btnElement) {
      document.querySelectorAll('.nav-btn').forEach(
        function (button) {
          button.classList.remove('active');
        }
      );

      btnElement.classList.add('active');
    }

    const container = document.getElementById(
      'main-module-container'
    );

    if (!container) {
      return;
    }

    container.innerHTML =
      '<div class="ag-loading">' +
        '<div class="ag-loading-inner">' +
          '<span class="ag-spinner" aria-hidden="true"></span>' +
          '<span>Cargando módulo...</span>' +
        '</div>' +
      '</div>';

    agRunAuthenticated('loadModuleHTML', moduleFileName)
      .then(function (htmlContent) {
        if (
          agCurrentModule !== moduleFileName ||
          request !== agModuleRequest ||
          !window.AGLogin.isAuthorized()
        ) {
          return;
        }

        container.innerHTML = htmlContent;

        const scripts = Array.from(
          container.getElementsByTagName('script')
        );

        scripts.forEach(function (sourceScript) {
          const scriptTag = document.createElement('script');

          if (sourceScript.src) {
            scriptTag.src = sourceScript.src;
          } else {
            scriptTag.text =
              sourceScript.textContent ||
              sourceScript.innerText ||
              '';
          }

          Array.from(sourceScript.attributes).forEach(
            function (attribute) {
              if (attribute.name !== 'src') {
                scriptTag.setAttribute(
                  attribute.name,
                  attribute.value
                );
              }
            }
          );

          document.body.appendChild(scriptTag);
          document.body.removeChild(scriptTag);
        });
      })
      .catch(function (error) {
        if (
          agCurrentModule !== moduleFileName ||
          request !== agModuleRequest ||
          !window.AGLogin.isAuthorized()
        ) {
          return;
        }

        const message =
          error && error.message
            ? error.message
            : 'No fue posible cargar el módulo.';

        container.innerHTML =
          '<div class="ag-module-error">' +
            '<div>' +
              '<strong style="display:block;color:#231E54;margin-bottom:8px;">' +
                'No se pudo abrir el módulo' +
              '</strong>' +
              '<span>' + escapeHtmlAG(message) + '</span>' +
            '</div>' +
          '</div>';
      });
  }

  /**
   * Escapa texto antes de insertarlo en un mensaje HTML.
   *
   * @param {unknown} value
   * @returns {string}
   */
  function escapeHtmlAG(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /**
   * Habilita la interacción después de la verificación del servidor.
   */
  document.addEventListener('ag:authenticated', function () {
    const app = document.querySelector('.ag-app');

    if (app) {
      app.inert = false;
    }
  });

  /**
   * Bloquea la interacción, elimina el HTML del módulo y
   * descarta sus solicitudes de carga pendientes.
   */
  document.addEventListener('ag:session-ended', function () {
    const app = document.querySelector('.ag-app');

    if (app) {
      app.inert = true;
    }

    const container = document.getElementById(
      'main-module-container'
    );

    if (container) {
      container.replaceChildren();
    }

    showDashboard();
  });

  /**
   * Conserva el comportamiento visual del dashboard.
   */
  window.addEventListener('load', function () {
    showDashboard();

    const hero = document.getElementById('ag-hero');
    const image = hero
      ? hero.querySelector('.ag-hero-image')
      : null;

    const dashboard = document.getElementById(
      'ag-dashboard-view'
    );

    if (
      !hero ||
      !image ||
      !dashboard ||
      window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches
    ) {
      return;
    }

    window.addEventListener(
      'scroll',
      function () {
        if (dashboard.hidden) {
          return;
        }

        const movement = Math.min(
          window.scrollY * 0.035,
          16
        );

        image.style.transform =
          'scale(1.025) translateY(' + movement + 'px)';
      },
      { passive: true }
    );
  });
</script>
